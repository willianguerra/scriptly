[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptly-flow-agent"
version = "0.2.0"
description = "Local browser automation agent for Scriptly"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "playwright>=1.51",
  "pydantic-settings>=2.8",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
test = [
  "httpx2>=2.0",
  "pytest>=8.3",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
